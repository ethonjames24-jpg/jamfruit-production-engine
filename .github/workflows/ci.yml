name: CI

on:
  push:
    branches:
      - master
      - 'a01/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Upstream regression tests
        run: npm test

      - name: JamFruit Safe Mode regression tests
        run: node test-safe-mode.js

      - name: JamFruit repository guard checks
        run: node scripts/security-check.js
